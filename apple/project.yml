# Generate Boltwork.xcodeproj with: cd apple && xcodegen
name: Boltwork
options:
  bundleIdPrefix: app.boltwork
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  BoltworkKit:
    path: BoltworkKit
targets:
  Boltwork:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Boltwork
    dependencies:
      - package: BoltworkKit
    entitlements:
      path: Boltwork/Resources/Boltwork.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.boltwork.apple
        PRODUCT_NAME: Boltwork
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Boltwork
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSFaceIDUsageDescription: Boltwork uses Face ID to unlock your vault without your account password.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Boltwork connects to a sync server on your private network if you set one up.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
    info:
      path: Boltwork/Resources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BoltworkUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: BoltworkUITests
    dependencies:
      - target: Boltwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.boltwork.apple.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Boltwork
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
schemes:
  Boltwork:
    build:
      targets:
        Boltwork: all
    test:
      targets:
        - BoltworkUITests
